# ros_gz_bridge mapping for ROS 2 Jazzy + Gazebo Sim Harmonic.
#
# Phase-2 robot namespace is /lunar_jackal/*. The previous /scan,
# /imu, /odom, /cmd_vel topic names are kept as documented aliases so
# any Phase-1 consumer keeps working.

# ---- clock ----
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# ---- lunar_jackal/* primary topic set ----
- ros_topic_name: /lunar_jackal/scan
  gz_topic_name: /lunar_jackal/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

# 3D point cloud from the same gpu_lidar (Dreamer consumes this).
- ros_topic_name: /lunar_jackal/points
  gz_topic_name: /lunar_jackal/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS

- ros_topic_name: /lunar_jackal/imu
  gz_topic_name: /lunar_jackal/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /lunar_jackal/odom
  gz_topic_name: /lunar_jackal/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /lunar_jackal/cmd_vel
  gz_topic_name: /lunar_jackal/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /lunar_jackal/chase_camera/image
  gz_topic_name: /lunar_jackal/chase_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /lunar_jackal/chase_camera/camera_info
  gz_topic_name: /lunar_jackal/chase_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# ---- /tf ----
- ros_topic_name: /tf
  gz_topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# ---- documented Phase-1 aliases (same gz topic → bare ROS name) ----
- ros_topic_name: /scan
  gz_topic_name: /lunar_jackal/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

- ros_topic_name: /imu
  gz_topic_name: /lunar_jackal/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /odom
  gz_topic_name: /lunar_jackal/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /cmd_vel
  gz_topic_name: /lunar_jackal/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
